[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eudis-swarm"
version = "0.3.0a0"
description = "Deterministic resilience and communication-topology simulation for a multi-UAV swarm"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Charalampos Nadiotis", email = "charalamposnadiotis44@gmail.com" }]
keywords = [
    "swarm",
    "uav",
    "multi-agent",
    "task-allocation",
    "communications-aware",
    "resilience",
    "simulation",
    "defence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/n0711/eudis-hackathon-swarm"
Repository = "https://github.com/n0711/eudis-hackathon-swarm"
Issues = "https://github.com/n0711/eudis-hackathon-swarm/issues"
Changelog = "https://github.com/n0711/eudis-hackathon-swarm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyright>=1.1.400,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]
# Software-in-the-loop only. Nothing in the core imports these, and a SITL run
# never produces a measured result: see docs/sitl.md.
sitl = ["pymavlink>=2.4.42"]
# Offline chart rendering only (e.g. lease_timeout_chart.py). Nothing in the
# core imports this.
charts = ["plotly>=5.24,<8"]

[project.scripts]
eudis-swarm = "eudis_swarm.simulation:main"
eudis-swarm-sweep = "eudis_swarm.sweep:main"
eudis-swarm-generalization = "eudis_swarm.generalization:main"
eudis-swarm-observation-replay = "eudis_swarm.observation_replay:main"
eudis-swarm-robustness = "eudis_swarm.robustness:main"
eudis-swarm-search = "eudis_swarm.search_mission:main"
# Lab field node (real UDP between processes/hosts; not deterministic).
eudis-field-node = "eudis_swarm.field_node:main"
eudis-field-launch = "eudis_swarm.field_launch:main"
eudis-field-report = "eudis_swarm.field_report:main"
eudis-field-probe = "eudis_swarm.field_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["eudis_swarm"]
omit = [
    # Needs a live autopilot to exercise, which CI deliberately does not have.
    # Everything in it that can be tested without one is, in tests/test_sitl.py.
    "src/eudis_swarm/sitl.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
